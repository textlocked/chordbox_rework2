; ChordBox rework — Stage 1: raw USB-MIDI receive + note display on ST7789
;
; No MIDI-specific library at all here (no usb_midi_host, no EZ_USB_MIDI_HOST).
; The earlephilhower "arduino-pico" core bundles its own copy of Adafruit
; TinyUSB, and that bundled copy already contains TinyUSB's native
; index-based tuh_midi_* USB-MIDI HOST class driver — we just talk to it
; directly. Verified against the actual installed
; .../Adafruit_TinyUSB_Arduino/src/class/midi/midi_host.h on this machine,
; not guessed from a changelog.
;
; The ONE thing that driver does NOT do out of the box: Adafruit's default
; TinyUSB config for rp2040 does not enable CFG_TUH_MIDI. The build_flags
; below turn it on. TinyUSB's convention is to guard these config macros
; with #ifndef so a build_flags -D override like this is the intended way
; to set them — if that assumption is wrong for this specific bundled
; version, the build will fail with "CFG_TUH_MIDI redefined", and the
; fallback is hand-editing this file directly:
;   C:\Users\Zainal\.platformio\packages\framework-arduinopico\
;     libraries\Adafruit_TinyUSB_Arduino\src\arduino\ports\rp2040\
;     tusb_config_rp2040.h
; and adding the CFG_TUH_MIDI / CFG_TUH_DEVICE_MAX lines there directly.

; CORRECTION: an earlier version of this file used
; `board_build.usb_stack = tinyusb_host`, which is not a real PlatformIO
; option for this platform — it was silently ignored, meaning TinyUSB was
; never actually enabled at all despite everything else being fixed. The
; arduino-pico project's own PlatformIO docs give exactly one documented
; way to select TinyUSB: build_flags = -DUSE_TINYUSB (confirmed at
; https://arduino-pico.readthedocs.io/en/latest/platformio.html). Once
; that's defined, Adafruit_TinyUSB.h resolves and Adafruit_USBH_Host
; (used in main.cpp for host mode) becomes available.

; CORRECTION #2: CFG_TUH_DEVICE_MAX=1 (previous version of this file) was
; a value I made up, not something from a working reference. TinyUSB's
; own official host/midi_rx example config uses:
;   CFG_TUH_HUB       1
;   CFG_TUH_DEVICE_MAX  (3*CFG_TUH_HUB + 1)   -> 4
;   CFG_TUH_MIDI      CFG_TUH_DEVICE_MAX
; i.e. it reserves more device-table headroom than "1" even for a single
; directly-connected device. Starving that table is a documented cause of
; a device partially enumerating, getting torn down again (firing an
; unmount-type event) without ever reaching the class mount callback —
; which matches the exact "unmount fires, mount never does" symptom seen
; on two completely different driver stacks. Also bumping
; CFG_TUH_ENUMERATION_BUFSIZE past its default 256, since that's a
; separately documented cause of silent enumeration failure for devices
; with larger/composite descriptors.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

build_flags =
    -DUSE_TINYUSB
    -DUSE_TINYUSB_HOST

    ; TinyUSB host configuration
    -DCFG_TUH_ENABLED=1
    -DCFG_TUD_ENABLED=0
    -DCFG_TUH_HUB=1
    -DCFG_TUH_DEVICE_MAX=4
    -DCFG_TUH_MIDI=4
    -DCFG_TUH_ENUMERATION_BUFSIZE=512

    ; Chord alternative matching: allow up to one missing note and no extras.
    -DMAX_ALTERNATIVE_MISSING_NOTES=1
    -DMAX_ALTERNATIVE_EXTRA_NOTES=0

    ; TinyUSB debug level. 0 = off.
    ; Was set to 2 earlier for enumeration debugging — turning it back
    ; off now, because those internal debug prints run synchronously
    ; over Serial1 on every single transfer completion, and are the
    ; likely cause of the suspiciously regular ~9.8ms gap between
    ; captured MIDI events (see the burst log data from testing). Our
    ; own in-RAM diagnostic logger in main.cpp doesn't need this.
    -DCFG_TUSB_DEBUG=0

    ; TFT_eSPI setup for the 170x320 ST7789 display
    -DUSER_SETUP_LOADED=1
    -DLOAD_GFXFF
    -DST7789_DRIVER
    -DCGRAM_OFFSET
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=17
    -DTFT_DC=20
    -DTFT_RST=21
    -DTFT_SPI_MODE=0
    -DSPI_FREQUENCY=40000000
    ;-DUSE_TINYUSB
    ;-DCFG_TUH_HUB=1
    ;-DCFG_TUH_DEVICE_MAX=4
    ;-DCFG_TUH_MIDI=CFG_TUH_DEVICE_MAX
    ;-DCFG_TUH_ENUMERATION_BUFSIZE=512

lib_deps =
    bodmer/TFT_eSPI

; 1. Universal Serial Upload Configuration
upload_protocol = picotool

; 2. Keep the serial monitor reading data from the same cable
monitor_port = COM5   ; <-- MATCH your CH340 COM port
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

; Force the current Arduino-Pico core rather than whatever
; framework version the PlatformIO platform happens to bundle.
platform_packages =
    framework-arduinopico @ https://github.com/earlephilhower/arduino-pico.git